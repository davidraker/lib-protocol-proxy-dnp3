[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "protocol-proxy-dnp3"
version = "2.0.0rc1"
description = "A DNP3 (IEEE 1815) Protocol Proxy built on dnp3py."
authors = ["The VOLTTRON Development Team <volttron@pnnl.gov>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-volttron/lib-protocol-proxy-dnp3"
homepage = "https://github.com/eclipse-volttron/lib-protocol-proxy-dnp3"
keywords = []
packages = [ { include = "protocol_proxy", from = "src" } ]

[tool.poetry.plugins."protocol_proxy.manifests"]
dnp3 = "protocol_proxy.protocol.dnp3:proxy.toml"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
protocol-proxy = ">=2.0.0rc3"
# Needs the analog output variations, command status delivery, the runner's operate helpers and the two-octet
# count fix (craigpnnl/dnp3py PRs #231-#233 and #235). Until a dnp3py release carries them, install the `volttron-dnp3`
# branch of https://github.com/davidraker/dnp3py, which is tagged v0.7.0 so it satisfies this range (for example
# `pip install git+https://github.com/davidraker/dnp3py.git@volttron-dnp3`). A git source here would stop the
# VOLTTRON platform from locking its environment at startup, so the dependency is a version range.
dnp3py = ">=0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"

[tool.isort]
profile = "black"

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 120
split_before_logical_operator = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
