[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "protocol-proxy-dnp3"
version = "2.0.0rc0"
description = "A DNP3 (IEEE 1815) master Protocol Proxy built on dnp3py."
authors = ["The VOLTTRON Development Team <volttron@pnnl.gov>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-volttron/lib-protocol-proxy-dnp3"
homepage = "https://github.com/eclipse-volttron/lib-protocol-proxy-dnp3"
keywords = []
packages = [ { include = "protocol_proxy", from = "src" } ]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
protocol-proxy = ">=2.0.0rc3"
# Until a dnp3py release carries analog output variations, command status delivery and the runner's
# operate helpers (PRs from the davidraker fork), depend on the branch that merges them.
dnp3py = { git = "https://github.com/davidraker/dnp3py.git", branch = "volttron-dnp3" }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"

[tool.isort]
profile = "black"

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 120
split_before_logical_operator = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
